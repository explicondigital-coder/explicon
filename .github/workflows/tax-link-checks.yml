name: Tax Link checks

on:
  pull_request:
  push:
    branches:
      - main
      - "feature/tax-link-card-layout"

jobs:
  regression-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Fiscal regression tests
        run: bun test src/lib/correlacoes.test.ts

      - name: TypeScript check
        run: bunx tsc --noEmit

      - name: Semantic lint
        run: |
          bunx eslint . --rule "prettier/prettier: off"

      - name: Build
        run: bun run build

      - name: Formatting report
        if: always()
        continue-on-error: true
        run: bunx prettier --check .
